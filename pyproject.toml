[project]
name = "reflectolearn"
version = "0.1.0"
description = "XRR inverse modeling with Abeles streaming + CNN"
readme = "README.md"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.11"
dependencies = [
    "torch",
    "matplotlib",
    "tqdm",
    "pandas",
    "seaborn",
    "scipy",
    "pydantic",
    "pyyaml",
    "loguru",
    "tensorboard",
    "typer",
    "optuna",
]

[project.optional-dependencies]
genx = [
    "genx3",
    "bumps",
]
mcmc = [
    "emcee",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/ReflectoLearn"
Repository = "https://github.com/NaNIsaac/ReflectoLearn"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
reflectolearn = "reflectolearn.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

# Windows(로컬 RTX): Blackwell sm_120 지원을 위해 CUDA 12.8 빌드 사용.
# 다른 플랫폼(Colab/Linux 등)에서는 PyPI 기본 torch 휠을 그대로 사용.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
